# A payment policy engine on Vela (Horizen) as a recipe: the entry is the owner's console (web.syn), a web app
# that makes a trigger contract through the factory on the stack, embeds app/app.syn into the
# release's guest module, deploys it to Vela and runs the treasury from the browser: policy, payees,
# the agent's proposals, approvals, and every payment as the chain sees it. This file only says what
# the code cannot say about itself; the `require` blocks are the manifests of capabilities. The
# standalone agent (agent.syn) and the owner's CLI (client/) do the same from a terminal.

name = "Payment policy engine"
slug = "vela-policy-engine"
version = "0.3.0"
kind = "web"
entry = "web.syn"
engine = "0.6"
tagline = "A payment policy engine on Horizen's Vela, in Synsema: an AI agent reviews invoices and proposes payments, the enclave enforces the spending policy (allowed payees, caps, an automatic limit, approvals) and a contract pays. The agent never holds a key."
tagline_es = "Un motor de políticas de pago en Vela (Horizen) con Synsema: un agente de IA revisa facturas y propone pagos, el enclave aplica la política de gasto (proveedores permitidos, topes, límite automático, aprobaciones) y un contrato paga. El agente nunca tiene una clave."
tagline_pt = "Um motor de políticas de pagamento no Vela (Horizen) com Synsema: um agente de IA revisa faturas e propõe pagamentos, o enclave aplica a política de gastos (beneficiários permitidos, tetos, limite automático, aprovações) e um contrato paga. O agente nunca tem uma chave."

[secrets]
VELA_SECP_KEY = "the owner's secp256k1 key: signs the transactions and pays the fees (hex). On the public devnet the token comes with an account of its own: a deployer with ETH and test tokens."
VELA_ADMIN_KEY = "the admin key when the kit signs allow-token and allow-authority itself (a devnet of your own). Empty on the public devnet, whose admin desk signs them (VELA_ADMIN_URL), and on a local kit, where the signing key is the admin."
VELA_P521_KEY = "P-521 private key for the encrypted channel with the Executor (hex). Provisioned on the devnet; made by the app itself when empty."

# The public Vela devnet by default: the provision URL hands out a token of your own and fills these
# (and the keys) when the project is created. Point them at your own Vela stack to leave the devnet;
# the factory is scripts/trigger/build.sh with WHAT=factory.
[env]
VELA_RPC_URL = "https://devnet.synsema.app/<token>/rpc"
VELA_AUTHORITY_URL = "https://devnet.synsema.app/<token>/authority"
VELA_SUBGRAPH_URL = "https://devnet.synsema.app/<token>/subgraph/subgraphs/name/hcce"
VELA_PROCESSOR = "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"
VELA_TEE_AUTHENTICATOR = "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
VELA_TRIGGER_FACTORY = "0xC9a43158891282A2B1475592D5719c001986Aaec"
VELA_TOKEN = ""
VELA_MAX_FEE = "100"

[provision]
env_url = "https://devnet.synsema.app/token"

# the app's state: the app id and its trigger, the keys it made, the agent's key, the payees
[volumes]
data = "./data"
