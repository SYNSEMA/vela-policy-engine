# Agent treasury on Vela (Horizen) as a recipe: the entry is the treasury console (web.syn), a web app
# that makes a trigger contract through the factory on the stack, embeds app/app.syn into the
# release's guest module, deploys it to Vela and runs the treasury from the browser: policy, payees,
# the agent's proposals, approvals, and every payment as the chain sees it. This file only says what
# the code cannot say about itself; the `require` blocks are the manifests of capabilities. The
# standalone agent (agent.syn) and the owner's CLI (client/) do the same from a terminal.

name = "Agent treasury on Vela"
slug = "vela-treasury"
version = "0.2.1"
kind = "web"
entry = "web.syn"
engine = "0.6"
tagline = "An agent proposes payments, the enclave applies the owner's policy, a contract pays: LLM outside, policy inside, on Horizen's Vela."
tagline_es = "Un agente propone pagos, el enclave aplica la política del dueño, un contrato paga: LLM afuera, política adentro, en Vela (Horizen)."
tagline_pt = "Um agente propõe pagamentos, o enclave aplica a política do dono, um contrato paga: LLM fora, política dentro, no Vela (Horizen)."

[secrets]
VELA_SECP_KEY = "the owner's secp256k1 key: signs the transactions and pays the fees (hex). On the public devnet the provision hands out Anvil #0, the deployer."
VELA_P521_KEY = "P-521 private key for the encrypted channel with the Executor (hex). Provisioned on the devnet; made by the app itself when empty."

# The public Vela devnet by default: the provision URL hands out a token of your own and fills these
# (and the keys) when the project is created. Point them at your own Vela stack to leave the devnet;
# the factory is scripts/trigger/build.sh with WHAT=factory.
[env]
VELA_RPC_URL = "https://devnet.synsema.app/<token>/rpc"
VELA_AUTHORITY_URL = "https://devnet.synsema.app/<token>/authority"
VELA_SUBGRAPH_URL = "https://devnet.synsema.app/<token>/subgraph/subgraphs/name/hcce"
VELA_PROCESSOR = "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"
VELA_TEE_AUTHENTICATOR = "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
VELA_TRIGGER_FACTORY = "0xC9a43158891282A2B1475592D5719c001986Aaec"
VELA_TOKEN = ""
VELA_MAX_FEE = "100"

[provision]
env_url = "https://devnet.synsema.app/token"

# the app's state: the app id and its trigger, the keys it made, the agent's key, the payees
[volumes]
data = "./data"
